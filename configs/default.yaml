seed: 42

paths:
  data_dir: "data"
  raw_dir: "data/raw"
  generated_dir: "data/generated"
  splits_dir: "data/splits"
  features_dir: "data/features"
  models_dir: "models_saved"
  results_dir: "docs/RESULTS"

dataset:
  fast_mode: false
  image:
    target_size: [256, 256]
    num_samples: 4000
    fast_num_samples: 40
    payload_rates: [0.10, 0.20, 0.30, 0.50]
    methods:
      - "lsb_replacement"
      - "lsb_matching"
      - "edge_adaptive"
      - "dct_ac"
  audio:
    sample_rate: 16000
    duration: 3.0
    num_samples: 2000
    fast_num_samples: 30
    payload_rates: [0.20, 0.40, 0.70, 1.00]
    methods:
      - "lsb_replacement"
      - "lsb_matching"
      - "echo_hiding"
  video:
    target_size: [128, 128]
    fps: 15
    duration: 2.0
    num_samples: 700
    fast_num_samples: 16
    sample_frames: 8
    lossless_codec: "ffv1"
    container: "mkv"
    payload_rates: [0.10, 0.20, 0.40]
    methods:
      - "frame_lsb"
      - "frame_lsb_matching"
  split:
    train_ratio: 0.70
    val_ratio: 0.15
    test_ratio: 0.15

features:
  cache_dir: "data/features/cache"
  num_workers: 4
  image_dim: 72
  audio_dim: 56
  video_dim: 64

models:
  latent_dim: 128
  hidden_dim: 256
  dropout: 0.2
  use_aux_head: true
  aux_loss_weight: 0.3
  target_fpr: 0.05
  temperature_scaling: true

training:
  epochs: 25
  fast_epochs: 5
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 6
  scheduler: "cosine"

# Deep learning models and profiles configuration
deep_models:
  shared_latent_dim: 128
  srnet:
    srm_filters: 30
    base_channels: 32
    unpooled_blocks: 7
    pooled_blocks: 4
    latent_dim: 128
    dropout: 0.1
  audio_1d:
    in_channels: 1
    base_channels: 32
    num_diff_filters: 8
    num_blocks: 4
    latent_dim: 128
    dropout: 0.1
  video_temporal:
    sample_frames: 8
    attention_heads: 4
    latent_dim: 128
    dropout: 0.1
  fusion:
    use_handcrafted: true
    latent_dim: 128
    dropout: 0.2

profiles:
  smoke:
    image_covers: 60
    audio_windows: 40
    video_clips: 12
    epochs: 2
    batch_size: 16
    learning_rate: 0.001
    weight_decay: 0.0001
  laptop:
    image_covers: 20000
    audio_windows: 8000
    video_clips: 1500
    epochs: 8
    batch_size: 16
    learning_rate: 0.0005
    weight_decay: 0.0001
  gpu:
    image_covers: 20000
    audio_windows: 8000
    video_clips: 1500
    epochs: 30
    batch_size: 32
    learning_rate: 0.0005
    weight_decay: 0.0001

aletheia:
  enabled: false

curriculum:
  high_payload_epochs: 2
  high_payload_min_rate: 0.30
